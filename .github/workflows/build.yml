name: Build Dread mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the project folder
        id: find
        run: |
          echo "Repo contents:"
          find . -maxdepth 3 -not -path './.git/*' | sort
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle found anywhere in the repo. The project files were not uploaded."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dread-mod
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
